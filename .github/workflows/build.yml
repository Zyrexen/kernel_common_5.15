name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: android13-5.15-rebased
          fetch-depth: 1

      - name: Free up disk space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h

          # Удаляем тяжелый хлам, который жрёт место на стандартных раннерах
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/gh
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          
          # Чистим пакетный кеш
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev \
            lld \
            pahole \
            perl \
            python3 \
            rsync \
            unzip \
            wget

      - name: Download Android Clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"

          wget -q \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-release/clang-r450784d.tar.gz" \
            -O clang.tar.gz

          mkdir clang
          tar -xf clang.tar.gz -C clang

      - name: Configure kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"

          make O=out \
            ARCH=arm64 \
            LLVM=1 \
            gki_defconfig

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/clang/bin:$PATH"

          nproc
          make -j$(nproc) \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            Image

      - name: Show build result
        run: |
          ls -lah out/arch/arm64/boot/
          file out/arch/arm64/boot/Image

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-A5-kernel-test
          path: |
            out/arch/arm64/boot/Image
            out/.config
            out/vmlinux
            out/System.map
